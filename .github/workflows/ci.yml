name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:

  # ── 1. Lint & syntax check ──────────────────────────────────────────────────
  lint:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (py_compile)
        working-directory: backend
        run: python -m py_compile main.py && echo "✅ No syntax errors"

      - name: Lint with flake8
        working-directory: backend
        run: |
          pip install flake8
          # Stop on actual errors; ignore long-line warnings (E501)
          flake8 main.py --max-line-length=100 --ignore=E501,W503

  # ── 2. Unit tests ───────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --tb=short

  # ── 3. Validate Docker builds ───────────────────────────────────────────────
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build ./backend \
            --tag devops-backend:ci \
            --cache-from type=gha \
            --cache-to   type=gha,mode=max

      - name: Build frontend image
        run: |
          docker build ./frontend \
            --tag devops-frontend:ci \
            --cache-from type=gha \
            --cache-to   type=gha,mode=max

      - name: Validate docker-compose config
        run: docker compose config --quiet && echo "✅ docker-compose.yml is valid"

  # ── 4. Integration smoke test ───────────────────────────────────────────────
  integration:
    name: Integration Smoke Test
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose up -d --build

      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ Backend is up"
              break
            fi
            echo "  attempt $i/20..."
            sleep 3
          done

      - name: Smoke — GET /
        run: curl -sf http://localhost:8000/ | grep "running"

      - name: Smoke — GET /health
        run: curl -sf http://localhost:8000/health | grep "healthy"

      - name: Smoke — POST /data
        run: |
          curl -sf -X POST http://localhost:8000/data \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Bot","message":"Integration test passed"}' | grep "CI Bot"

      - name: Smoke — GET /data
        run: curl -sf http://localhost:8000/data | grep "CI Bot"

      - name: Frontend reachable
        run: curl -sf http://localhost:3000/ | grep "DevOps"

      - name: Tear down
        if: always()
        run: docker compose down -v
