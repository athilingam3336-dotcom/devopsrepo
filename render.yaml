services:
  - type: web
    name: devops-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devops-db
          property: connectionString

  - type: web
    name: devops-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend

databases:
  - name: devops-db
    databaseName: devdb
    user: devuser
